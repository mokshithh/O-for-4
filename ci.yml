name: CI

# Lightweight CI for Nuro.
#
# This workflow is intentionally safe and non-invasive:
#   - It does NOT modify any application code.
#   - It does NOT require any secrets to be configured.
#   - It uses strict-only flake8 rules (real Python errors only, not style),
#     so existing code in the repo will not suddenly start failing on it.
#   - It does NOT block deploys — Render's auto-deploy from main is
#     unaffected unless a branch protection rule is added later that
#     explicitly requires this workflow to pass.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Lint (syntax and undefined names)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 on api, services, and core
        # Strict-only checks: real Python errors only
        # (E9 = syntax errors, F63/F7/F82 = undefined names and broken imports).
        # Pure style issues are intentionally ignored so existing code
        # is not affected by adding this workflow.
        run: |
          flake8 api services core \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  build:
    name: Install dependencies and verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dataset decompresses (mirrors render.yaml build step)
        run: |
          mkdir -p data
          python -c "import lzma, shutil; shutil.copyfileobj(lzma.open('youtube_trending_cleaned.csv.xz'), open('data/youtube_trending.csv','wb'))"
          ls -lh data/youtube_trending.csv

  # ---------------------------------------------------------------------------
