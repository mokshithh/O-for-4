  #
  # Disabled by default because the existing auth code calls out to Supabase
  # at startup and the AI services require a real OpenAI key, both of which
  # need either real secrets or a TEST_MODE bypass in the application code.
  #
  # To enable, add the required repository secrets (OPENAI_API_KEY,
  # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SECRET_KEY)
